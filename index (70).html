<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <title>Homework Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #242836;
      --border: #2e3345;
      --text: #f0f2f8;
      --text-muted: #9aa3b8;
      --primary: #6c8cff;
      --primary-hover: #8aa4ff;
      --success: #3ecf8e;
      --warning: #f5a524;
      --danger: #f56565;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      opacity: 0.25;
      filter: blur(100px);
      content: "";
      pointer-events: none;
    }

    body::before {
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: var(--primary);
      animation: float 12s ease-in-out infinite;
    }

    body::after {
      right: -80px;
      bottom: -80px;
      width: 350px;
      height: 350px;
      background: #a78bfa;
      animation: float 15s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(30px, 40px);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      animation: fadeDown 0.6s ease-out;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      box-shadow: 0 4px 16px rgba(108, 140, 255, 0.4);
      font-size: 1.3rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin-top: 0.15rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
      animation: fadeUp 0.6s ease-out 0.1s both;
    }

    .stat-card {
      padding: 1.1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .stat-label {
      margin-top: 0.2rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .stat-card.total .stat-value {
      color: var(--primary);
    }

    .stat-card.upcoming .stat-value {
      color: var(--warning);
    }

    .stat-card.overdue .stat-value {
      color: var(--danger);
    }

    .stat-card.done .stat-value {
      color: var(--success);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.6s ease-out 0.2s both;
    }

    .filters {
      display: flex;
      max-width: 100%;
      gap: 0.4rem;
      overflow-x: auto;
      padding: 0.3rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }

    .filter-btn {
      flex: 0 0 auto;
      border: 0;
      border-radius: 9px;
      padding: 0.45rem 0.9rem;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all var(--transition);
    }

    .filter-btn:hover {
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 10px rgba(108, 140, 255, 0.35);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border: 0;
      border-radius: 11px;
      padding: 0.65rem 1.2rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all var(--transition);
    }

    .btn:focus-visible,
    .filter-btn:focus-visible,
    .icon-btn:focus-visible,
    .check:focus-visible {
      outline: 3px solid rgba(138, 164, 255, 0.65);
      outline-offset: 2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: white;
      box-shadow: 0 4px 16px rgba(108, 140, 255, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(108, 140, 255, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-ghost {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .btn-ghost:hover {
      background: var(--border);
    }

    .assignments {
      display: grid;
      gap: 1rem;
    }

    .assignment-card {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 1rem;
      overflow: hidden;
      padding: 1.25rem 1.4rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      animation: cardIn 0.4s ease-out both;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    }

    .assignment-card:hover {
      transform: translateY(-2px);
      border-color: #3d4460;
      box-shadow: var(--shadow);
    }

    .assignment-card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background: var(--primary);
      content: "";
    }

    .assignment-card.overdue::before {
      background: var(--danger);
    }

    .assignment-card.upcoming::before {
      background: var(--warning);
    }

    .assignment-card.completed::before {
      background: var(--success);
    }

    .assignment-card.completed {
      opacity: 0.65;
    }

    .assignment-card.completed .assignment-title {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .check-wrap {
      padding-top: 0.15rem;
    }

    .check {
      display: grid;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      place-items: center;
      border: 2px solid var(--border);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      transition: all var(--transition);
    }

    .check:hover {
      border-color: var(--primary);
    }

    .check.done {
      border-color: var(--success);
      background: var(--success);
    }

    .check.done::after {
      color: white;
      content: "✓";
      font-size: 0.75rem;
      font-weight: 700;
    }

    .assignment-body {
      min-width: 0;
    }

    .assignment-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.85rem;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .class-badge {
      border-radius: 6px;
      padding: 0.15rem 0.55rem;
      background: rgba(108, 140, 255, 0.15);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .assignment-title {
      margin-bottom: 0.3rem;
      overflow-wrap: anywhere;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .assignment-desc {
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }

    .due-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
    }

    .due-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border-radius: 7px;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .due-badge.ok {
      background: rgba(108, 140, 255, 0.12);
      color: var(--primary);
    }

    .due-badge.soon {
      background: rgba(245, 165, 36, 0.15);
      color: var(--warning);
    }

    .due-badge.late {
      background: rgba(245, 101, 101, 0.15);
      color: var(--danger);
    }

    .due-badge.done {
      background: rgba(62, 207, 142, 0.15);
      color: var(--success);
    }

    .teacher {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .icon-btn {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition);
    }

    .icon-btn:hover {
      border-color: #4a5168;
      background: var(--border);
      color: var(--text);
    }

    .icon-btn.delete:hover {
      border-color: rgba(245, 101, 101, 0.4);
      background: rgba(245, 101, 101, 0.12);
      color: var(--danger);
    }

    .empty {
      padding: 4rem 1.5rem;
      color: var(--text-muted);
      text-align: center;
      animation: fadeUp 0.5s ease-out;
    }

    .empty-icon {
      margin-bottom: 1rem;
      opacity: 0.5;
      font-size: 3rem;
    }

    .empty h3 {
      margin-bottom: 0.4rem;
      color: var(--text);
      font-size: 1.2rem;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      visibility: hidden;
      background: rgba(0, 0, 0, 0.65);
      opacity: 0;
      backdrop-filter: blur(6px);
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.open {
      visibility: visible;
      opacity: 1;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.92) translateY(20px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.75rem;
      background: var(--surface);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.open .modal {
      transform: scale(1) translateY(0);
    }

    .modal h2 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      font-size: 1.25rem;
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .optional {
      opacity: 0.7;
      font-weight: 400;
    }

    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.2);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      z-index: 200;
      max-width: calc(100vw - 2rem);
      transform: translateX(-50%) translateY(80px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1.25rem;
      background: var(--surface-2);
      color: var(--text);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 1.35rem;
      }

      .assignment-card {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .card-actions {
        grid-column: 1 / -1;
        flex-direction: row;
        justify-content: flex-end;
      }
    }

    @media (max-width: 500px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .modal-actions {
        flex-direction: column-reverse;
      }

      .modal-actions .btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">📚</div>

        <div>
          <h1>Homework Tracker</h1>
          <p class="subtitle">Stay on top of your assignments</p>
        </div>
      </div>

      <button class="btn btn-primary" id="openModalBtn" type="button">
        <span aria-hidden="true">+</span>
        New Assignment
      </button>
    </header>

    <section class="stats" aria-label="Assignment statistics">
      <article class="stat-card total">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Total</div>
      </article>

      <article class="stat-card upcoming">
        <div class="stat-value" id="statUpcoming">0</div>
        <div class="stat-label">Upcoming</div>
      </article>

      <article class="stat-card overdue">
        <div class="stat-value" id="statOverdue">0</div>
        <div class="stat-label">Overdue</div>
      </article>

      <article class="stat-card done">
        <div class="stat-value" id="statDone">0</div>
        <div class="stat-label">Completed</div>
      </article>
    </section>

    <section class="controls" aria-label="Assignment filters">
      <div class="filters" role="group" aria-label="Filter assignments">
        <button class="filter-btn active" type="button" data-filter="all">All</button>
        <button class="filter-btn" type="button" data-filter="active">Active</button>
        <button class="filter-btn" type="button" data-filter="upcoming">Upcoming</button>
        <button class="filter-btn" type="button" data-filter="overdue">Overdue</button>
        <button class="filter-btn" type="button" data-filter="completed">Done</button>
      </div>
    </section>

    <section class="assignments" id="assignmentList" aria-live="polite"></section>
  </main>

  <div
    class="modal-overlay"
    id="modalOverlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-hidden="true"
  >
    <div class="modal">
      <h2 id="modalTitle">✨ New Assignment</h2>

      <form id="assignmentForm">
        <input type="hidden" id="editId">

        <div class="form-group">
          <label for="className">Class Name</label>
          <input
            type="text"
            id="className"
            placeholder="e.g. Math 101"
            maxlength="60"
            required
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="title">Assignment / Work</label>
          <input
            type="text"
            id="title"
            placeholder="e.g. Chapter 5 problems"
            maxlength="120"
            required
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="description">
            Description
            <span class="optional">(optional)</span>
          </label>

          <textarea
            id="description"
            placeholder="Any extra details or notes..."
            maxlength="500"
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" required>
          </div>

          <div class="form-group">
            <label for="teacher">
              Teacher
              <span class="optional">(optional)</span>
            </label>

            <input
              type="text"
              id="teacher"
              placeholder="e.g. Ms. Smith"
              maxlength="50"
              autocomplete="off"
            >
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Add Assignment</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const STORAGE_KEY = "homework-tracker-v2";

    let assignments = [];
    let currentFilter = "all";
    let editingId = null;
    let toastTimer = null;
    let lastFocusedElement = null;

    const listEl = document.getElementById("assignmentList");
    const modalOverlay = document.getElementById("modalOverlay");
    const form = document.getElementById("assignmentForm");
    const openModalBtn = document.getElementById("openModalBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const toastEl = document.getElementById("toast");

    const classNameInput = document.getElementById("className");
    const titleInput = document.getElementById("title");
    const descriptionInput = document.getElementById("description");
    const dueDateInput = document.getElementById("dueDate");
    const teacherInput = document.getElementById("teacher");
    const editIdInput = document.getElementById("editId");
    const modalTitle = document.getElementById("modalTitle");
    const submitBtn = document.getElementById("submitBtn");

    function getLocalDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function getTomorrowDateString() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);

      return getLocalDateString(tomorrow);
    }

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return `assignment-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function isValidDateString(value) {
      if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return false;
      }

      const date = new Date(`${value}T00:00:00`);
      return !Number.isNaN(date.getTime());
    }

    function normalizeAssignment(item) {
      if (!item || typeof item !== "object") {
        return null;
      }

      const className = typeof item.className === "string" ? item.className.trim() : "";
      const title = typeof item.title === "string" ? item.title.trim() : "";
      const dueDate = typeof item.dueDate === "string" ? item.dueDate : "";

      if (!className || !title || !isValidDateString(dueDate)) {
        return null;
      }

      return {
        id: typeof item.id === "string" && item.id ? item.id : createId(),
        className: className.slice(0, 60),
        title: title.slice(0, 120),
        description: typeof item.description === "string" ? item.description.slice(0, 500) : "",
        dueDate,
        teacher: typeof item.teacher === "string" ? item.teacher.slice(0, 50) : "",
        completed: Boolean(item.completed),
        createdAt: typeof item.createdAt === "string" ? item.createdAt : new Date().toISOString()
      };
    }

    function loadAssignments() {
      try {
        const rawData = localStorage.getItem(STORAGE_KEY);

        if (!rawData) {
          assignments = [];
          return;
        }

        const parsedData = JSON.parse(rawData);

        if (!Array.isArray(parsedData)) {
          assignments = [];
          return;
        }

        assignments = parsedData
          .map(normalizeAssignment)
          .filter(Boolean);
      } catch (error) {
        assignments = [];
        showToast("Saved data could not be loaded.");
      }
    }

    function saveAssignments() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(assignments));
      } catch (error) {
        showToast("Could not save changes. Storage may be full.");
      }
    }

    function showToast(message) {
      clearTimeout(toastTimer);

      toastEl.textContent = message;
      toastEl.classList.add("show");

      toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2400);
    }

    function parseDueDate(dateString) {
      return new Date(`${dateString}T00:00:00`);
    }

    function getTodayAtMidnight() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return today;
    }

    function getDaysUntilDue(dateString) {
      const dueDate = parseDueDate(dateString);
      const today = getTodayAtMidnight();

      return Math.round((dueDate - today) / 86400000);
    }

    function getStatus(item) {
      if (item.completed) {
        return "completed";
      }

      const daysUntilDue = getDaysUntilDue(item.dueDate);

      if (daysUntilDue < 0) {
        return "overdue";
      }

      if (daysUntilDue <= 3) {
        return "upcoming";
      }

      return "ok";
    }

    function formatDue(item) {
      if (item.completed) {
        return {
          text: "Completed",
          cls: "done"
        };
      }

      const dueDate = parseDueDate(item.dueDate);
      const daysUntilDue = getDaysUntilDue(item.dueDate);

      const dateText = dueDate.toLocaleDateString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: dueDate.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined
      });

      if (daysUntilDue < 0) {
        const overdueDays = Math.abs(daysUntilDue);

        return {
          text: `${overdueDays} day${overdueDays === 1 ? "" : "s"} overdue · ${dateText}`,
          cls: "late"
        };
      }

      if (daysUntilDue === 0) {
        return {
          text: `Due today · ${dateText}`,
          cls: "soon"
        };
      }

      if (daysUntilDue === 1) {
        return {
          text: `Due tomorrow · ${dateText}`,
          cls: "soon"
        };
      }

      if (daysUntilDue <= 3) {
        return {
          text: `Due in ${daysUntilDue} days · ${dateText}`,
          cls: "soon"
        };
      }

      return {
        text: `Due ${dateText}`,
        cls: "ok"
      };
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value ?? "");
      return div.innerHTML;
    }

    function openModal(item = null) {
      lastFocusedElement = document.activeElement;

      editingId = item ? item.id : null;
      editIdInput.value = item ? item.id : "";

      modalTitle.textContent = item ? "✏️ Edit Assignment" : "✨ New Assignment";
      submitBtn.textContent = item ? "Save Changes" : "Add Assignment";

      classNameInput.value = item ? item.className : "";
      titleInput.value = item ? item.title : "";
      descriptionInput.value = item ? item.description : "";
      dueDateInput.value = item ? item.dueDate : getTomorrowDateString();
      teacherInput.value = item ? item.teacher : "";

      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");

      window.setTimeout(() => {
        classNameInput.focus();
      }, 100);
    }

    function closeModal() {
      modalOverlay.classList.remove("open");
      modalOverlay.setAttribute("aria-hidden", "true");

      form.reset();
      editIdInput.value = "";
      editingId = null;

      if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
        lastFocusedElement.focus();
      }
    }

    function updateStats() {
      const total = assignments.length;
      const completed = assignments.filter((item) => item.completed).length;
      const overdue = assignments.filter((item) => getStatus(item) === "overdue").length;
      const upcoming = assignments.filter((item) => {
        const status = getStatus(item);
        return status === "upcoming" || status === "ok";
      }).length;

      document.getElementById("statTotal").textContent = total;
      document.getElementById("statUpcoming").textContent = upcoming;
      document.getElementById("statOverdue").textContent = overdue;
      document.getElementById("statDone").textContent = completed;
    }

    function getFilteredAssignments() {
      return [...assignments]
        .filter((item) => {
          const status = getStatus(item);

          if (currentFilter === "all") {
            return true;
          }

          if (currentFilter === "active") {
            return !item.completed;
          }

          if (currentFilter === "upcoming") {
            return status === "upcoming" || status === "ok";
          }

          if (currentFilter === "overdue") {
            return status === "overdue";
          }

          if (currentFilter === "completed") {
            return item.completed;
          }

          return true;
        })
        .sort((a, b) => {
          if (a.completed !== b.completed) {
            return a.completed ? 1 : -1;
          }

          const dateDifference = a.dueDate.localeCompare(b.dueDate);

          if (dateDifference !== 0) {
            return dateDifference;
          }

          return a.createdAt.localeCompare(b.createdAt);
        });
    }

    function getEmptyState() {
      const titles = {
        all: "No assignments yet",
        active: "No active assignments",
        upcoming: "No upcoming assignments",
        overdue: "No overdue assignments",
        completed: "No completed assignments"
      };

      const descriptions = {
        all: "Click “New Assignment” to get started.",
        active: "You do not have any unfinished work right now.",
        upcoming: "Nothing is due in the future right now.",
        overdue: "Great job — you have no overdue work.",
        completed: "Complete an assignment to see it here."
      };

      return `
        <div class="empty">
          <div class="empty-icon" aria-hidden="true">📭</div>
          <h3>${titles[currentFilter]}</h3>
          <p>${descriptions[currentFilter]}</p>
        </div>
      `;
    }

    function render() {
      updateStats();

      const items = getFilteredAssignments();

      if (items.length === 0) {
        listEl.innerHTML = getEmptyState();
        return;
      }

      listEl.innerHTML = items
        .map((item, index) => {
          const status = getStatus(item);
          const due = formatDue(item);
          const escapedClassName = escapeHtml(item.className);
          const escapedTitle = escapeHtml(item.title);
          const escapedDescription = escapeHtml(item.description);
          const escapedTeacher = escapeHtml(item.teacher);
          const completionText = item.completed ? "Mark as incomplete" : "Mark as complete";

          return `
            <article
              class="assignment-card ${status}"
              data-id="${escapeHtml(item.id)}"
              style="animation-delay: ${Math.min(index * 0.05, 0.4)}s"
            >
              <div class="check-wrap">
                <button
                  class="check ${item.completed ? "done" : ""}"
                  type="button"
                  data-action="toggle"
                  aria-label="${completionText}: ${escapedTitle}"
                  title="${completionText}"
                ></button>
              </div>

              <div class="assignment-body">
                <div class="assignment-meta">
                  <span class="class-badge">${escapedClassName}</span>
                  ${
                    item.teacher
                      ? `<span class="teacher">👤 ${escapedTeacher}</span>`
                      : ""
                  }
                </div>

                <h3 class="assignment-title">${escapedTitle}</h3>

                ${
                  item.description
                    ? `<p class="assignment-desc">${escapedDescription}</p>`
                    : ""
                }

                <div class="due-info">
                  <span class="due-badge ${due.cls}">📅 ${escapeHtml(due.text)}</span>
                </div>
              </div>

              <div class="card-actions">
                <button
                  class="icon-btn"
                  type="button"
                  data-action="edit"
                  aria-label="Edit ${escapedTitle}"
                  title="Edit assignment"
                >✏️</button>

                <button
                  class="icon-btn delete"
                  type="button"
                  data-action="delete"
                  aria-label="Delete ${escapedTitle}"
                  title="Delete assignment"
                >🗑️</button>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function handleFormSubmit(event) {
      event.preventDefault();

      const className = classNameInput.value.trim();
      const title = titleInput.value.trim();
      const description = descriptionInput.value.trim();
      const dueDate = dueDateInput.value;
      const teacher = teacherInput.value.trim();

      if (!className || !title || !isValidDateString(dueDate)) {
        showToast("Please complete the required fields.");
        return;
      }

      if (editingId) {
        const assignmentIndex = assignments.findIndex((item) => item.id === editingId);

        if (assignmentIndex === -1) {
          showToast("That assignment could not be found.");
          closeModal();
          render();
          return;
        }

        assignments[assignmentIndex] = {
          ...assignments[assignmentIndex],
          className,
          title,
          description,
          dueDate,
          teacher
        };

        showToast("Assignment updated.");
      } else {
        assignments.push({
          id: createId(),
          className,
          title,
          description,
          dueDate,
          teacher,
          completed: false,
          createdAt: new Date().toISOString()
        });

        showToast("Assignment added.");
      }

      saveAssignments();
      closeModal();
      render();
    }

    function handleAssignmentAction(event) {
      const button = event.target.closest("[data-action]");

      if (!button) {
        return;
      }

      const card = button.closest(".assignment-card");

      if (!card) {
        return;
      }

      const assignmentId = card.dataset.id;
      const action = button.dataset.action;
      const assignment = assignments.find((item) => item.id === assignmentId);

      if (!assignment) {
        showToast("That assignment could not be found.");
        render();
        return;
      }

      if (action === "toggle") {
        assignment.completed = !assignment.completed;
        saveAssignments();
        render();

        showToast(
          assignment.completed
            ? "Marked complete 🎉"
            : "Marked incomplete."
        );
      }

      if (action === "edit") {
        openModal(assignment);
      }

      if (action === "delete") {
        const approved = window.confirm(
          `Delete "${assignment.title}" from ${assignment.className}?`
        );

        if (!approved) {
          return;
        }

        assignments = assignments.filter((item) => item.id !== assignmentId);
        saveAssignments();
        render();
        showToast("Assignment deleted.");
      }
    }

    openModalBtn.addEventListener("click", () => openModal());
    cancelBtn.addEventListener("click", closeModal);
    form.addEventListener("submit", handleFormSubmit);
    listEl.addEventListener("click", handleAssignmentAction);

    modalOverlay.addEventListener("click", (event) => {
      if (event.target === modalOverlay) {
        closeModal();
      }
    });

    document.querySelectorAll(".filter-btn").forEach((button) => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        document.querySelectorAll(".filter-btn").forEach((filterButton) => {
          filterButton.classList.toggle(
            "active",
            filterButton === button
          );
        });

        render();
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalOverlay.classList.contains("open")) {
        closeModal();
      }
    });

    loadAssignments();
    render();
  </script>
</body>
</html>
